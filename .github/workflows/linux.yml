name: Linux CI

on:
  push:
    branches:
    - '*'
  pull_request:
    branches:
    - '*'

concurrency: linux-ci-${{ github.ref }}

jobs:
  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake gcc g++ make \
          libfreetype-dev libvulkan-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev

    - name: Configure
      run: >
        cmake -B _Build/ci -G "Unix Makefiles"
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DKYTY_BUILD_LAUNCHER=OFF
        -DKYTY_WARNINGS_ARE_ERRORS=OFF
        source

    - name: Build fc_script
      run: cmake --build _Build/ci -j "$(nproc)" --target fc_script

    - name: Smoke test (banner)
      # Headless runner: use SDL's dummy video driver so subsystem init succeeds
      run: |
        SDL_VIDEODRIVER=dummy ./_Build/ci/fc_script | tee banner.txt
        grep -q "fc_script <lua_script>" banner.txt
